name: 🚀 Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ✅ Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Verify tag targets master
        shell: bash
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/master)"

      - name: 🔎 Verify package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: 🗜️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 🛠️ Install dependencies
        uses: ./.github/actions/cached-deps

      - name: ♻️ Check circular dependencies
        run: bun run check-circular-deps

      - name: 🗜️ Restore ESLint cache
        uses: ./.github/actions/cached-eslint

      - name: 🗃️ Build database
        run: bun run db:build

      - name: 🔎 Validate database
        run: bun run db:validate

      - name: ✅ Validate source
        run: bun run validate

      - name: 🏗️ Build applications
        run: bun run build

      - name: 🔎 Verify build layout
        shell: bash
        run: |
          test -f dist/electron/browser/index.html
          test -f dist/docs/browser/index.html
          test -f .electron/electron/main/index.js
          test -f .electron/electron/preload.js
          test -f resources/database/qdb.sqlite

      - name: 🛠️ Copy index.html to 404.html
        shell: bash
        run: cp ./dist/docs/browser/index.html ./dist/docs/browser/404.html

      - name: 📚 Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: dist/docs/browser
          if-no-files-found: error

  windows:
    name: 🪟 Publish Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7

      - name: 🗜️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 🛠️ Install dependencies
        uses: ./.github/actions/cached-deps

      - name: 📦 Make Windows release
        run: bun run release:windows

      - name: 🔎 Verify release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/make/squirrel.windows/x64/QDB-Finder-Setup.exe')) { throw 'Squirrel Setup.exe is missing.' }
          if (-not (Get-ChildItem 'out/make/zip/win32/x64' -Filter '*.zip')) { throw 'Portable ZIP is missing.' }
          if (-not (Test-Path 'out/make/squirrel.windows/x64/RELEASES')) { throw 'Squirrel update metadata is missing.' }
          if (-not (Get-ChildItem 'out/make/squirrel.windows/x64' -Filter '*.nupkg')) { throw 'Squirrel update package is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/QDB Finder.exe')) { throw 'Packaged executable is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/resources/app.asar')) { throw 'ASAR bundle is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/resources/database/qdb.sqlite')) { throw 'Packaged database is missing.' }

      - name: 🔐 Create checksums
        shell: pwsh
        run: |
          Get-ChildItem out/make -File -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: .github/release-intro.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/make/**/*

  deploy-docs:
    name: 📚 Deploy GitHub Pages
    needs: [validate, windows]
    if: contains(github.ref, 'beta') == false
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: dist/docs/browser

      - name: 🚀 Deploy Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: ./dist/docs/browser
