name: 🧪 Test PR

'on': pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🛠️ Validate & Build
    runs-on: ubuntu-latest
    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7

      - name: 🗜️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 🛠️ Install dependencies
        uses: ./.github/actions/cached-deps

      - name: 🗃️ Build database
        run: bun run db:build

      - name: 🔎 Validate database
        run: bun run db:validate

      - name: 🧹 Check formatting
        run: bun run format:check

      - name: ♻️ Check circular dependencies
        run: bun run check-circular-deps

      - name: 🗜️ Restore ESLint cache
        uses: ./.github/actions/cached-eslint

      - name: 🧹 Lint
        run: bun run lint

      - name: 🧪 Test with coverage
        run: bun run test:coverage

      - name: 📊 Set Electron coverage report to PR
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' }}
        uses: ./.github/actions/set-report-to-pr
        with:
          coverage-file: coverage/electron/cobertura-coverage.xml
          report-name: Electron Coverage
          comment-header: electron-coverage-report

      - name: 📊 Set documentation coverage report to PR
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' }}
        uses: ./.github/actions/set-report-to-pr
        with:
          coverage-file: coverage/docs/cobertura-coverage.xml
          report-name: Documentation Coverage
          comment-header: documentation-coverage-report

      - name: 📊 Set tools coverage report to PR
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' }}
        uses: ./.github/actions/set-report-to-pr
        with:
          coverage-file: coverage/tools/cobertura-coverage.xml
          report-name: Node Tools Coverage
          comment-header: node-tools-coverage-report

      - name: 🏗️ Build applications
        run: bun run build

      - name: 🔎 Verify artifact layout
        shell: bash
        run: |
          test -f dist/electron/browser/index.html
          test -f dist/docs/browser/index.html
          test -f .electron/electron/main/index.js
          test -f .electron/electron/preload.js
          test -f resources/database/qdb.sqlite

  package-windows:
    name: 🪟 Package Windows x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7

      - name: 🗜️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 🛠️ Install dependencies
        uses: ./.github/actions/cached-deps

      - name: 📦 Make Windows release
        run: bun run release:windows

      - name: 🔎 Verify release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/make/squirrel.windows/x64/QDB-Finder-Setup.exe')) { throw 'Squirrel Setup.exe is missing.' }
          if (-not (Get-ChildItem 'out/make/zip/win32/x64' -Filter '*.zip')) { throw 'Portable ZIP is missing.' }
          if (-not (Test-Path 'out/make/squirrel.windows/x64/RELEASES')) { throw 'Squirrel update metadata is missing.' }
          if (-not (Get-ChildItem 'out/make/squirrel.windows/x64' -Filter '*.nupkg')) { throw 'Squirrel update package is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/QDB Finder.exe')) { throw 'Packaged executable is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/resources/app.asar')) { throw 'ASAR bundle is missing.' }
          if (-not (Test-Path 'out/qdb-finder-win32-x64/resources/database/qdb.sqlite')) { throw 'Packaged database is missing.' }
