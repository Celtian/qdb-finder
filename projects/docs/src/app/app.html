<a
  class="fixed top-2 left-2 z-100 -translate-y-3/2 rounded-md bg-primary px-4 py-skip font-bold text-white no-underline focus:translate-y-0"
  href="#main-content"
  >Skip to content</a
>
<header class="sticky top-0 z-20 shrink-0">
  <mat-toolbar>
    <button
      class="mr-1 hidden! max-nav:inline-flex!"
      type="button"
      mat-icon-button
      aria-label="Open documentation navigation"
      aria-controls="documentation-navigation"
      [attr.aria-expanded]="navigationOpened()"
      (click)="toggleNavigation()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a
      class="inline-flex min-w-0 items-center gap-brand-gap text-base font-bold text-inherit no-underline"
      routerLink="/"
      aria-label="QDB Finder documentation home"
    >
      <img class="rounded-md" ngSrc="qdb-finder.png" width="28" height="28" alt="" priority />
      <span>QDB Finder</span>
      <span class="font-normal text-docs-label max-mobile:hidden">Documentation</span>
    </a>
    <span class="flex-1"></span>
    <a mat-button [href]="site.links.repository">
      <mat-icon>code</mat-icon>
      GitHub
    </a>
  </mat-toolbar>
</header>

<mat-sidenav-container>
  <mat-sidenav
    id="documentation-navigation"
    aria-label="Documentation navigation"
    [mode]="navigationMode()"
    [opened]="navigationOpened()"
    (openedChange)="navigationChanged($event)"
  >
    <p class="mx-4 mt-6 mb-2 text-xs font-bold tracking-section text-docs-navigation uppercase">
      Documentation
    </p>
    <mat-nav-list aria-label="Documentation pages">
      @for (link of links; track link.path) {
        <a
          #activePage="routerLinkActive"
          mat-list-item
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [activated]="activePage.isActive"
          [routerLink]="'/' + link.path"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeNavigation()"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="flex min-h-content-screen flex-col">
      <main id="main-content" tabindex="-1"><router-outlet /></main>
      <footer>
        <div
          class="m-auto flex w-full max-w-275 items-center justify-between gap-4 px-footer-inline py-4 max-mobile:flex-col max-mobile:items-start"
        >
          <p class="text-sm leading-6">
            &copy; {{ site.copyrightYear }} Dominik Hladík ·
            <a [href]="site.links.version">QDB Finder {{ site.versionLabel }}</a>
          </p>
          <nav
            class="flex flex-wrap justify-end gap-1 text-sm max-mobile:justify-start"
            aria-label="Project links"
          >
            <a mat-button [href]="site.links.latestRelease">Latest download</a>
            <a mat-button [href]="site.links.repository">Source</a>
            <a mat-button [href]="site.links.changelog">Changelog</a>
            <a mat-button [href]="site.links.license">MIT License</a>
          </nav>
        </div>
      </footer>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<button
  class="fixed right-5 bottom-5 z-30"
  type="button"
  mat-mini-fab
  ngxScrollTop
  aria-label="Scroll to top"
>
  <mat-icon aria-hidden="true">keyboard_arrow_up</mat-icon>
</button>
