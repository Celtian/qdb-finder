<header class="flex items-start justify-between gap-4 px-6 pt-6 max-compact:px-4 max-compact:pt-5">
  <div class="flex min-w-0 items-center gap-4">
    <img
      class="shrink-0 rounded-xl"
      ngSrc="qdb-finder.png"
      width="56"
      height="56"
      alt=""
      priority
    />
    <div>
      <h2 class="m-0 p-0 text-dialog-title" mat-dialog-title>QDB Finder</h2>
      <p class="mt-micro! mb-0 text-on-surface-variant tabular-nums">Version {{ version }}</p>
    </div>
  </div>
  <button
    type="button"
    class="shrink-0"
    mat-icon-button
    mat-dialog-close
    aria-label="Close About dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</header>

<mat-dialog-content>
  <p class="m-0 leading-copy">Fast, offline FIFA database search across FIFA 11–23.</p>
  <p class="mt-4 mb-0 text-legal text-on-surface-variant">
    © {{ copyrightYear }} {{ author }} · MIT License
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button mat-dialog-close>Close</button>
  <a
    mat-button
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open QDB Finder documentation in your browser"
    [href]="documentationUrl"
  >
    <mat-icon>menu_book</mat-icon>
    Documentation
  </a>
  <a
    mat-flat-button
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open the QDB Finder GitHub repository in your browser"
    [href]="repositoryUrl"
  >
    <mat-icon>code</mat-icon>
    GitHub
  </a>
</mat-dialog-actions>
