<header class="flex items-start justify-between gap-4 px-8 pt-8 max-small:px-5 max-small:pt-5">
  <div class="flex min-w-0 items-center gap-5 max-small:gap-4">
    <img class="shrink-0" ngSrc="qdb-finder.png" width="72" height="72" alt="" priority />
    <div>
      <h2 mat-dialog-title>QDB Finder</h2>
      <p class="mt-2 mb-0 text-on-surface-variant tabular-nums">Version {{ version }}</p>
    </div>
  </div>
  <button
    type="button"
    class="shrink-0 bg-surface-container-high"
    mat-icon-button
    mat-dialog-close
    aria-label="Close About dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
</header>

<mat-dialog-content>
  <p class="m-0 leading-copy">Fast, offline FIFA database search across FIFA 11–23.</p>
  <p class="mt-4 mb-0 text-legal text-on-surface-variant">
    © {{ copyrightYear }} {{ author }} · MIT License
  </p>
</mat-dialog-content>

<mat-dialog-actions>
  <button type="button" mat-button mat-dialog-close>Close</button>
  <div class="flex flex-wrap justify-end gap-2 max-small:justify-start">
    <a
      mat-button
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open QDB Finder documentation in your browser"
      [href]="documentationUrl"
    >
      <mat-icon aria-hidden="true">menu_book</mat-icon>
      Documentation
    </a>
    <a
      mat-flat-button
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the QDB Finder GitHub repository in your browser"
      [href]="repositoryUrl"
    >
      <mat-icon aria-hidden="true">code</mat-icon>
      GitHub
    </a>
  </div>
</mat-dialog-actions>
