<form
  class="flex size-full min-h-0 flex-col overflow-hidden bg-surface-container-lowest"
  aria-labelledby="finder-column-title"
  (submit)="apply(); $event.preventDefault()"
>
  <div class="flex items-center justify-between border-b border-outline-variant px-4 py-3">
    <h2 id="finder-column-title">Choose columns</h2>
    <button matIconButton type="button" aria-label="Close columns" (click)="cancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="flex-1 overflow-auto px-4 py-5" cdkScrollable>
    <p class="mt-0 mb-2 text-on-surface-variant" id="column-order-instructions">
      Choose and reorder the columns shown in the {{ data.finder }} table. Drag a handle or focus it
      and use the Up and Down arrow keys.
    </p>
    <div
      class="flex flex-col"
      data-column-list
      cdkDropList
      cdkDropListLockAxis="y"
      role="list"
      [cdkDropListData]="orderedColumns()"
      (cdkDropListDropped)="drop($event)"
    >
      @for (column of orderedColumns(); track column.key) {
        <div
          class="flex min-h-12 items-center gap-2 rounded-lg bg-surface-container-lowest pl-1"
          cdkDrag
          data-column-row
          role="listitem"
          [cdkDragData]="column"
        >
          <mat-checkbox [formField]="columnsForm[column.key]">
            {{ column.label }}
          </mat-checkbox>
          <button
            class="shrink-0 cursor-grab text-on-surface-variant active:cursor-grabbing"
            cdkDragHandle
            matIconButton
            type="button"
            aria-describedby="column-order-instructions"
            [attr.aria-label]="'Reorder ' + column.label + ' column'"
            (keydown.arrowup)="moveColumn(column, -1); $event.preventDefault()"
            (keydown.arrowdown)="moveColumn(column, 1); $event.preventDefault()"
          >
            <mat-icon aria-hidden="true">drag_indicator</mat-icon>
          </button>
          <ng-template cdkDragPreview [matchSize]="true">
            <div
              class="flex items-center justify-between overflow-clip! rounded-lg bg-surface-container-lowest px-3! py-0! text-on-surface shadow-level3 outline -outline-offset-1 outline-outline-variant"
              data-column-drag-preview
              aria-hidden="true"
            >
              <span>{{ column.label }}</span>
              <mat-icon>drag_indicator</mat-icon>
            </div>
          </ng-template>
        </div>
      }
    </div>
    <p class="sr-only" aria-live="polite">{{ announcement() }}</p>
  </div>

  <div
    class="flex items-center gap-2 border-t border-outline-variant px-4 py-3 max-drawer:flex-wrap max-drawer:[&>span]:hidden"
  >
    <button matButton type="button" (click)="resetDefaults()">Reset to defaults</button>
    <span></span>
    <button matButton type="button" (click)="cancel()">Cancel</button>
    <button matButton="filled" type="submit">Apply</button>
  </div>
</form>
