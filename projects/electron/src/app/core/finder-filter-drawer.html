<div
  class="grid h-full min-h-0 grid-rows-drawer bg-surface-container-lowest"
  [attr.aria-labelledby]="titleId()"
>
  <div class="flex items-center justify-between gap-3 border-b border-outline-variant px-5 py-4">
    <div>
      <p class="m-0 text-2xs font-bold tracking-label text-primary uppercase">QDB Finder</p>
      <h2 [id]="titleId()">{{ title() }}</h2>
    </div>
    <button matIconButton type="button" [attr.aria-label]="'Close ' + title()" (click)="cancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="min-w-0 overflow-auto overscroll-contain p-5">
    <ng-content />
  </div>

  <div
    class="flex items-center gap-3 border-t border-outline-variant px-5 py-4 max-tiny:flex-wrap max-tiny:[&>span]:hidden"
  >
    <button matButton type="button" [disabled]="!canClear()" (click)="clearAll.emit()">
      Clear all
    </button>
    <span></span>
    <button matButton type="button" (click)="cancel()">Cancel</button>
    <button matButton="filled" type="button" (click)="apply.emit()">Apply</button>
  </div>
</div>
