<h2 mat-dialog-title>Reset finder filters?</h2>
<mat-dialog-content>
  Saved filters for players, teams, leagues, referees and stadiums will return to their defaults.
  Column layouts, your theme and databases will not change.
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" mat-button mat-dialog-close>Cancel</button>
  <button type="button" mat-flat-button [mat-dialog-close]="true">Reset filters</button>
</mat-dialog-actions>
